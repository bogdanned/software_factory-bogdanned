name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  test:
    needs: typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: bugboard, POSTGRES_PASSWORD: bugboard, POSTGRES_DB: bugboard }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bugboard" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgres://bugboard:bugboard@localhost:5432/bugboard
      SESSION_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test

  e2e:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: bugboard, POSTGRES_PASSWORD: bugboard, POSTGRES_DB: bugboard }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bugboard" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgres://bugboard:bugboard@localhost:5432/bugboard
      SESSION_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npm run e2e

  fallow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: npx --yes fallow@3.37.0 audit --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

  # Factory drafts only: when every job above is green, take the PR out of draft.
  ready:
    needs: [lint, typecheck, test, e2e, fallow]
    if: github.event_name == 'pull_request' && github.event.pull_request.draft && startsWith(github.head_ref, 'factory/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # GitHub won't undraft with pull-requests: write alone, it needs contents: write too.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Do nothing unless factory.config.yml says auto_ready: true
          grep -q '^auto_ready: true' factory.config.yml || { echo "auto_ready is off"; exit 0; }
          # Take the PR out of draft
          gh pr ready "$PR_NUMBER"
          # Say why on the PR
          gh pr comment "$PR_NUMBER" --body "All gates green: marked ready for review."

  # Factory drafts only: a red check gives the implementor another round, up to
  # limits.max_fix_rounds. The last round hands the ticket to a human.
  fix:
    needs: [lint, typecheck, test, e2e, fallow]
    if: failure() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'factory/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: write starts the fix round.
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Another implementor round, or escalate the ticket to a human
          node factory/scripts/fix.mjs decide
