name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint

  typecheck:
    timeout-minutes: 10
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  test:
    timeout-minutes: 15
    needs: typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: bugboard, POSTGRES_PASSWORD: bugboard, POSTGRES_DB: bugboard }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bugboard" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgres://bugboard:bugboard@localhost:5432/bugboard
      SESSION_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test

  e2e:
    timeout-minutes: 20
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: bugboard, POSTGRES_PASSWORD: bugboard, POSTGRES_DB: bugboard }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bugboard" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgres://bugboard:bugboard@localhost:5432/bugboard
      SESSION_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npm run e2e

  # Fails on any new duplication, dead code or complexity. Inherited debt goes to the job summary.
  fallow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Fallow reads the source, it needs no npm ci. Pinned so a Fallow release can't turn PRs red.
      - name: Audit the PR against its base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          npx --yes fallow@3.37.0 audit --base "origin/$BASE_REF" --format json --quiet > "$RUNNER_TEMP/fallow.json"
          code=$?
          set -e
          node factory/scripts/fallow.mjs "$RUNNER_TEMP/fallow.json" "$code"

  # Factory branches only: no protected paths, no skipped tests, no silenced checks, no deleted tests.
  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: node factory/scripts/guard.mjs

  # Factory drafts only: when every job above is green, plain code marks the PR ready for review.
  ready:
    needs: [lint, typecheck, test, e2e, fallow, guard]
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'factory/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node factory/scripts/ready.mjs
