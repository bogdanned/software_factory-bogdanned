name: migrate-prod
on:
  push:
    branches: [main]
    paths: ["db/migrations/**"]
  workflow_dispatch:

concurrency: migrate-prod

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Check the secret
        run: test -n "$PROD_DATABASE_URL" || { echo "Add the PROD_DATABASE_URL repo secret"; exit 1; }
      - run: npm ci
      - run: npm run db:migrate
