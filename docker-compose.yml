services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bugboard
      POSTGRES_PASSWORD: bugboard
      POSTGRES_DB: bugboard
    ports:
      - "${BUGBOARD_DB_PORT:-5432}:5432"
    volumes:
      - bugboard-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugboard"]
      interval: 2s
      retries: 20
  pgadmin:
    image: dpage/pgadmin4:9
    profiles: [tools]
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bugboard.dev
      PGADMIN_DEFAULT_PASSWORD: bugboard
      # Desktop mode: no login page and no master password prompt
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
volumes:
  bugboard-db:
