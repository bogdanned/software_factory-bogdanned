# The factory's settings. Every workflow and script reads them from here.
# Fill this in as you build the factory (tasks 3 to 10).

tracker:
  kind: linear
  team: BBD

labels:
  new: factory:new
  ready: factory:ready
  in_progress: factory:in-progress
  needs_human: factory:needs-human
  blast_low: blast:low
  blast_high: blast:high

# Agents must never change these. Enforce it in code, not just in prompts.
protected_paths:
  - .github/
  - factory/
  - factory.config.yml
  - .claude/

# Any change here is high blast, whatever the refiner thinks.
high_blast_paths:
  - legacy/api/routes/admin.ts
  - legacy/api/routes/auth.ts
  - db/
  
# Commands every PR must pass.
gates:
  lint: npm run lint
  typecheck: npm run typecheck
  test: npm test
  e2e: npm run e2e

# Once every check is green, a CI step (no AI) takes the factory PR out of draft.
auto_ready: true

limits:
  max_open_prs: 2
  max_fix_rounds: 3
  max_turns: 60
  timeout_minutes: 20
